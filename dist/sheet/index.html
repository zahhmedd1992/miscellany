<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sheet — Miscellany</title>
<style>
:root{
  --bg:#FFFFFF; --chrome:#F7F5F1; --chrome-2:#EFECE6;
  --line:#E3E0DA; --line-2:#CFCAC1;
  --ink:#211C16; --ink-2:#4A4338; --muted:#6C6356;
  --accent:#9A3B1B; --accent-2:#7E2F14; --accent-tint:#F3E7DF;
  --green:#2F5D3A;
  /* System fonts only. A tool whose whole claim is that your file never
     leaves your machine must not fetch a stylesheet from Google on every
     load — and an installed copy has to work with no network at all. */
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit}

/* ---- title bar ---- */
.title{
  display:flex;align-items:center;gap:.75rem;
  padding:.45rem .75rem;background:var(--chrome);
  border-bottom:1px solid var(--line);flex:none;
}
.brand{font-weight:700;letter-spacing:-.01em;font-size:.85rem}
.brand span{color:var(--accent)}
.docname{
  font-size:.8rem;color:var(--ink-2);background:none;border:1px solid transparent;
  border-radius:3px;padding:.15rem .4rem;min-width:8rem;
}
.docname:hover{border-color:var(--line-2)}
.docname:focus{outline:none;border-color:var(--accent);background:#fff}
.title .sp{flex:1}
.tbtn{
  background:none;border:1px solid var(--line-2);border-radius:3px;
  padding:.25rem .6rem;font-size:.75rem;cursor:pointer;color:var(--ink-2);
}
.tbtn:hover{background:#fff;border-color:var(--accent);color:var(--accent)}

/* ---- toolbar (generated) ---- */
.toolbar{
  display:flex;align-items:center;gap:.15rem;flex-wrap:wrap;
  padding:.3rem .6rem;background:var(--chrome-2);
  border-bottom:1px solid var(--line);flex:none;
}
.tool{
  background:none;border:1px solid transparent;border-radius:3px;
  padding:.28rem .5rem;cursor:pointer;font-size:.78rem;white-space:nowrap;
  display:flex;align-items:center;gap:.3rem;color:var(--ink-2);
}
.tool:hover{background:#fff;border-color:var(--line-2);color:var(--ink)}
.tool:active{background:var(--accent-tint)}
.tool .g{font-weight:600;font-size:.85rem;width:1em;text-align:center}
.tsep{width:1px;height:1.1rem;background:var(--line-2);margin:0 .3rem}
.more{
  margin-left:auto;font-size:.72rem;color:var(--muted);
  display:flex;align-items:center;gap:.35rem;
}
.more kbd{
  font-family:var(--mono);font-size:.68rem;background:#fff;
  border:1px solid var(--line-2);border-bottom-width:2px;border-radius:3px;padding:.05rem .3rem;
}

/* ---- formula bar ---- */
.fbar{
  display:flex;align-items:stretch;background:#fff;
  border-bottom:1px solid var(--line);flex:none;
}
.addr{
  width:76px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:.75rem;font-weight:500;
  border-right:1px solid var(--line);color:var(--ink-2);
}
.fx{
  width:28px;flex:none;display:flex;align-items:center;justify-content:center;
  font-style:italic;font-weight:600;color:var(--muted);
  border-right:1px solid var(--line);font-size:.8rem;
}
#finput{
  flex:1;border:0;outline:none;padding:.4rem .6rem;
  font-family:var(--mono);font-size:.8rem;color:var(--ink);background:#fff;
}
#finput:focus{background:#FFFDF8}

/* ---- grid ---- */
.gridwrap{flex:1;position:relative;overflow:hidden;min-height:0}
#grid{width:100%;height:100%;display:block;cursor:cell}
#editor{
  position:absolute;display:none;z-index:5;
  border:2px solid var(--accent);outline:none;
  font-family:var(--sans);font-size:13px;padding:0 6px;
  background:#fff;color:var(--ink);
}

.tabs{
  display:flex;gap:2px;padding:.25rem .5rem 0;background:var(--chrome-2);
  border-bottom:1px solid var(--line);flex:none;overflow-x:auto;
}
.tab{
  background:var(--chrome);border:1px solid var(--line);border-bottom:0;
  border-radius:3px 3px 0 0;padding:.25rem .7rem;font-size:.76rem;
  cursor:pointer;color:var(--muted);white-space:nowrap;
}
.tab:hover{color:var(--ink)}
.tab.on{background:#fff;color:var(--ink);font-weight:600;border-color:var(--line-2)}
#st-file{color:var(--ink-2)}

/* ---- status ---- */
.status{
  display:flex;align-items:center;gap:1.1rem;
  padding:.3rem .75rem;background:var(--chrome);
  border-top:1px solid var(--line);flex:none;
  font-size:.73rem;color:var(--muted);
}
.status b{color:var(--ink-2);font-weight:600}
.status .sp{flex:1}
.saved{color:var(--green);font-weight:600}

#swatches{
  position:fixed;z-index:40;background:#fff;border:1px solid var(--line-2);
  border-radius:5px;box-shadow:0 10px 28px rgba(33,28,22,.22);padding:.55rem;
}
.sw-title{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin:0 0 .4rem .1rem}
.sw-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.sw{width:22px;height:22px;border:1px solid rgba(0,0,0,.18);border-radius:3px;cursor:pointer;padding:0}
.sw:hover{outline:2px solid var(--accent);outline-offset:1px}
.sw-none{
  margin-top:.45rem;width:100%;background:none;border:1px solid var(--line-2);
  border-radius:3px;padding:.2rem;font-size:.72rem;cursor:pointer;color:var(--ink-2);
}
.sw-none:hover{border-color:var(--accent);color:var(--accent)}

/* ---- command palette ---- */
.palette{
  position:fixed;inset:0;background:rgba(33,28,22,.28);
  display:none;align-items:flex-start;justify-content:center;
  padding-top:12vh;z-index:50;backdrop-filter:blur(2px);
}
.palette.on{display:flex}
.pbox{
  width:min(560px,92vw);background:#fff;border-radius:6px;
  box-shadow:0 18px 48px rgba(33,28,22,.28);overflow:hidden;
  border:1px solid var(--line-2);
}
#pinput{
  width:100%;border:0;outline:none;padding:.85rem 1rem;
  font-size:.95rem;font-family:var(--sans);
  border-bottom:1px solid var(--line);
}
#plist{max-height:52vh;overflow-y:auto;margin:0;padding:.3rem;list-style:none}
#plist li{
  padding:.5rem .7rem;border-radius:4px;cursor:pointer;
  display:flex;align-items:baseline;gap:.6rem;
}
#plist li.sel{background:var(--accent-tint)}
#plist .pt{font-weight:600;font-size:.85rem;flex:none}
#plist .pd{font-size:.75rem;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#plist .pk{font-family:var(--mono);font-size:.68rem;color:var(--muted);flex:none}
#plist .pg{
  font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);flex:none;font-weight:700;width:3.6rem;
}
.pempty{padding:1.2rem;text-align:center;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>

<div class="title">
  <div class="brand">Miscellany <span>·</span> Sheet</div>
  <input class="docname" id="docname" value="Untitled" spellcheck="false" />
  <div class="sp"></div>
  <button class="tbtn" id="btn-profile">Simple mode</button>
  <button class="tbtn" id="btn-mcp">Show API</button>
</div>

<div class="toolbar" id="toolbar"></div>

<div class="fbar">
  <div class="addr" id="addr">A1</div>
  <div class="fx">fx</div>
  <input id="finput" spellcheck="false" autocomplete="off" placeholder="Value or =formula" />
</div>

<div class="tabs" id="tabs" style="display:none"></div>

<div class="gridwrap">
  <canvas id="grid"></canvas>
  <input id="editor" spellcheck="false" autocomplete="off" />
</div>

<div class="status">
  <span id="st-sel"><b>A1</b></span>
  <span id="st-stats"></span>
  <span class="sp"></span>
  <span id="st-file"></span>
  <span id="st-cnt"></span>
  <span id="st-save" class="saved">saved</span>
</div>

<div class="palette" id="palette">
  <div class="pbox">
    <input id="pinput" placeholder="Type a command…" spellcheck="false" autocomplete="off" />
    <ul id="plist"></ul>
  </div>
</div>

<script type="module" src="./app.js"></script>
<input type="file" id="fileinput" accept=".xlsx" style="display:none" />
</body>
</html>
