<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sheet + Deck — one document, two views</title>
<style>
:root{
  --bg:#FFFFFF; --chrome:#F7F5F1; --chrome-2:#EFECE6;
  --line:#E3E0DA; --line-2:#CFCAC1;
  --ink:#211C16; --ink-2:#4A4338; --muted:#6C6356;
  --accent:#9A3B1B; --accent-2:#7E2F14; --accent-tint:#F3E7DF;
  --green:#2F5D3A;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit}

.title{
  display:flex;align-items:center;gap:.75rem;
  padding:.45rem .75rem;background:var(--chrome);
  border-bottom:1px solid var(--line);flex:none;
}
.brand{font-weight:700;letter-spacing:-.01em;font-size:.85rem}
.brand span{color:var(--accent)}
.title .sp{flex:1}
.claim{font-size:.78rem;color:var(--muted)}
.claim b{color:var(--ink-2);font-weight:600}

.split{flex:1;display:flex;min-height:0}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.pane.sheet{flex:1.05;border-right:1px solid var(--line-2)}
.pane.deck{flex:1;background:var(--chrome-2)}
.pane-hd{
  display:flex;align-items:center;gap:.5rem;
  padding:.32rem .7rem;background:var(--chrome-2);
  border-bottom:1px solid var(--line);flex:none;
  font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:700;
}
.pane.deck .pane-hd{background:var(--chrome)}
.pane-hd .sp{flex:1}
.pane-hd em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;font-size:.72rem}

.fbar{display:flex;align-items:stretch;background:#fff;border-bottom:1px solid var(--line);flex:none}
.addr{width:68px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:.74rem;font-weight:500;
  border-right:1px solid var(--line);color:var(--ink-2)}
#finput{flex:1;border:0;outline:none;padding:.36rem .6rem;
  font-family:var(--mono);font-size:.78rem;color:var(--ink);background:#fff}
#finput:focus{background:#FFFDF8}

.canvaswrap{flex:1;position:relative;overflow:hidden;min-height:0}
canvas{width:100%;height:100%;display:block}
#grid{cursor:cell}
#editor{position:absolute;display:none;z-index:5;border:2px solid var(--accent);
  outline:none;font-family:var(--sans);font-size:13px;padding:0 6px;background:#fff;color:var(--ink)}

.slides{display:flex;gap:.3rem;padding:.3rem .7rem;background:var(--chrome);
  border-top:1px solid var(--line);flex:none}
.slidebtn{background:#fff;border:1px solid var(--line-2);border-radius:3px;
  padding:.18rem .55rem;font-size:.74rem;cursor:pointer;color:var(--muted)}
.slidebtn.on{border-color:var(--accent);color:var(--accent);font-weight:600}

.status{
  display:flex;align-items:center;gap:1.1rem;
  padding:.3rem .75rem;background:var(--chrome);
  border-top:1px solid var(--line);flex:none;font-size:.73rem;color:var(--muted);
}
.status b{color:var(--ink-2);font-weight:600}
.status .sp{flex:1}
.pulse{color:var(--green);font-weight:600;opacity:0;transition:opacity .12s}
.pulse.on{opacity:1}
</style>
</head>
<body>

<div class="title">
  <div class="brand">Miscellany <span>·</span> Sheet + Deck</div>
  <div class="sp"></div>
  <div class="claim">One document. <b>Type in a cell and watch the slide.</b></div>
</div>

<div class="split">
  <div class="pane sheet">
    <div class="pane-hd">Sheet <span class="sp"></span><em id="sheet-note"></em></div>
    <div class="fbar">
      <div class="addr" id="addr">A1</div>
      <input id="finput" spellcheck="false" autocomplete="off" placeholder="Value or =formula" />
    </div>
    <div class="canvaswrap">
      <canvas id="grid"></canvas>
      <input id="editor" spellcheck="false" autocomplete="off" />
    </div>
  </div>

  <div class="pane deck">
    <div class="pane-hd">Deck <span class="sp"></span><em id="deck-note"></em></div>
    <div class="canvaswrap"><canvas id="slide"></canvas></div>
    <div class="slides" id="slides"></div>
  </div>
</div>

<div class="status">
  <span id="st-sel"><b>A1</b></span>
  <span id="st-stats"></span>
  <span class="sp"></span>
  <span id="st-link"></span>
  <span id="pulse" class="pulse">slide updated</span>
</div>

<script type="module" src="./compose.js"></script>
</body>
</html>
